services:
  db:
    image: postgres:16-alpine
    container_name: pairup-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pairup}
      POSTGRES_USER: ${POSTGRES_USER:-pairup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pairup}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pairup} -d ${POSTGRES_DB:-pairup}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pairup-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
