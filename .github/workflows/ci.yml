name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - ".github/workflows/ci.yml"
              - "apps/web/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            api:
              - ".github/workflows/ci.yml"
              - "apps/api/**"

  web:
    name: web
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: No relevant web changes
        if: needs.changes.outputs.web != 'true'
        run: echo "Skipping web checks because no web files changed."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.web == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.web == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: needs.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.web == 'true'
        run: pnpm lint
      - if: needs.changes.outputs.web == 'true'
        run: pnpm typecheck
      - if: needs.changes.outputs.web == 'true'
        run: pnpm test

  api:
    name: api
    runs-on: ubuntu-latest
    needs: changes
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pairup
          POSTGRES_USER: pairup
          POSTGRES_PASSWORD: pairup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pairup -d pairup"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      POSTGRES_DB: pairup
      POSTGRES_USER: pairup
      POSTGRES_PASSWORD: pairup
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-secret
      DJANGO_DEBUG: false
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - name: No relevant api changes
        if: needs.changes.outputs.api != 'true'
        run: echo "Skipping api checks because no api files changed."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.api == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.api == 'true'
        with:
          python-version: "3.12"
      - name: Install API dependencies
        if: needs.changes.outputs.api == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./apps/api[dev]
      - name: Run API tests
        if: needs.changes.outputs.api == 'true'
        working-directory: apps/api
        run: pytest
